name: kmod

# Build the out-of-tree Trusty modules (and the small SMC probe) against the
# kernel tag with the config embedded in the installed kernel. Kept separate
# from build.yml: that job spends most of its time on the device tree and the
# submission checks, which are irrelevant to a compile-only iteration.

on:
  workflow_dispatch:
  push:
    paths:
      - "probe/**"
      - "trusty/**"
      - "pmu/**"
      - "modem/**"
      - ".github/workflows/kmod.yml"

permissions:
  contents: read

concurrency:
  group: kmod-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/Seuj09/ums9230-mainline-linux
  KERNEL_TAG: x6525

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the port
        uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang dwarves flex libelf-dev libssl-dev llvm lld

      - name: Checkout the kernel at ${{ env.KERNEL_TAG }}
        run: git clone --depth 1 --branch "$KERNEL_TAG" "$KERNEL_REPO" kernel

      - name: Build the probe against the running config
        run: |
          cd kernel
          KHEAD=$(git rev-parse HEAD)
          rm -rf .git
          make ARCH=arm64 LLVM=1 mrproper
          cp "$GITHUB_WORKSPACE"/probe/config-running.aarch64 .config
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 -j"$(nproc)" modules_prepare
          echo "kernel tree $KHEAD"
          sha256sum include/linux/module.h
          grep -n 'kprobes_text_start' include/linux/module.h || true
          echo "autoconf:"
          grep -E '^#define CONFIG_(KPROBES|DYNAMIC_DEBUG_CORE) ' include/generated/autoconf.h || true
          echo "resolved config:"
          grep -E '^CONFIG_(KPROBES|DYNAMIC_DEBUG_CORE|DYNAMIC_DEBUG|KALLSYMS|KALLSYMS_ALL|MODULE_UNLOAD|MODULE_SIG)=' \
            .config include/config/auto.conf || true
          make ARCH=arm64 LLVM=1 -j"$(nproc)" KBUILD_MODPOST_WARN=1 KCFLAGS=-H \
            M="$GITHUB_WORKSPACE/probe" modules > /tmp/probe-build.log 2>&1 || {
              tail -100 /tmp/probe-build.log; exit 1; }
          echo "headers used:"
          grep -E '(linux/module\.h|generated/autoconf\.h)' /tmp/probe-build.log | head -10 || true
          cp .config "$GITHUB_WORKSPACE"/probe/final.config
          ls -l "$GITHUB_WORKSPACE"/probe/trusty_probe.ko
          echo "module objects:"
          for f in "$GITHUB_WORKSPACE"/probe/trusty_probe.o \
                   "$GITHUB_WORKSPACE"/probe/trusty_probe.mod.o; do
            echo "-- $(basename "$f")"
            readelf -SW "$f" 2>/dev/null | grep this_module || true
          done
          echo "mod.c head:"
          sed -n '1,40p' "$GITHUB_WORKSPACE"/probe/trusty_probe.mod.c || true

      - name: Build the Trusty modules
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 -j"$(nproc)" KBUILD_MODPOST_WARN=1 \
            M="$GITHUB_WORKSPACE/trusty" modules
          ls -l "$GITHUB_WORKSPACE"/trusty/*.ko

      - name: Build the PMU helper
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 -j"$(nproc)" KBUILD_MODPOST_WARN=1 \
            M="$GITHUB_WORKSPACE/pmu" modules
          ls -l "$GITHUB_WORKSPACE"/pmu/*.ko

      - name: Build the patched modem driver
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 -j"$(nproc)" KBUILD_MODPOST_WARN=1 \
            M="$GITHUB_WORKSPACE/modem" modules
          ls -l "$GITHUB_WORKSPACE"/modem/*.ko

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusty-probe
          path: |
            probe/trusty_probe.ko
            probe/final.config
            trusty/*.ko
            pmu/*.ko
            modem/*.ko
          if-no-files-found: warn
